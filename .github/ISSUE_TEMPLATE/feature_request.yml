name: Feature request
description: Suggest a concrete improvement to MineDock.
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What behavior would help?
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Relevant engines or platforms
