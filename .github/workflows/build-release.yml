name: Build distribution artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      official_checks:
        description: 'Opt-in official catalog, Java/PHP and content checks (external downloads; no Minecraft/EULA acceptance)'
        type: boolean
        default: false
      paper_eula_gate:
        description: 'Opt-in real Paper bootstrap with eula=false (no playable world)'
        type: boolean
        default: false
      windows_signing:
        description: 'Sign future Windows artifacts with the owner PFX (main only; no release publication)'
        type: boolean
        default: false
      windows_signing_self_test:
        description: 'Explicit disposable Windows signing QA on x64/ARM64 (NOT a release identity; temporary packages discarded)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
            command: build:windows
          - os: windows-11-arm
            arch: arm64
            command: build:windows
          - os: ubuntu-24.04
            arch: x64
            command: build:linux
          - os: ubuntu-24.04-arm
            arch: arm64
            command: build:linux
          - os: macos-15-intel
            arch: x64
            command: build:mac
          - os: macos-15
            arch: arm64
            command: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node -e "if(process.arch !== '${{ matrix.arch }}') throw new Error('Runner architecture mismatch')"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - if: github.event_name == 'workflow_dispatch' && inputs.official_checks
        run: pnpm test:official --catalogs --runtimes --content
        env:
          MINEDOCK_GITHUB_TOKEN: ${{ github.token }}
      - if: github.event_name == 'workflow_dispatch' && inputs.paper_eula_gate
        run: pnpm test:live
      - name: Test disposable native Windows signing
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.windows_signing_self_test
        shell: powershell
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { throw 'Source build failed.' }
          ./scripts/windows/Test-SigningIntegration.ps1 -Package
      - name: Require a trusted signing ref
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.windows_signing
        shell: powershell
        env:
          TRUSTED: ${{ github.repository == 'Bobydeluxe/MineDock' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: if ($env:TRUSTED -ne 'true') { throw 'Owner signing is allowed only from the default branch.' }
      - name: Prepare owner Windows certificate
        id: windows_signing
        if: runner.os == 'Windows' && github.repository == 'Bobydeluxe/MineDock' && ((github.event_name == 'workflow_dispatch' && inputs.windows_signing && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.MINEDOCK_WINDOWS_SIGNING_ENABLED == 'true'))
        shell: powershell
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          MINEDOCK_WINDOWS_CERT_SHA256: ${{ vars.MINEDOCK_WINDOWS_CERT_SHA256 }}
        run: ./scripts/windows/Prepare-CiSigning.ps1
      - run: pnpm ${{ matrix.command }}
        env:
          WIN_CSC_LINK: ${{ steps.windows_signing.outputs.certificate }}
          WIN_CSC_KEY_PASSWORD: ${{ steps.windows_signing.outputs.enabled == 'true' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          MINEDOCK_WINDOWS_SIGNING_REQUIRED: ${{ steps.windows_signing.outputs.enabled == 'true' && 'true' || 'false' }}
          MINEDOCK_WINDOWS_CERT_SHA256: ${{ vars.MINEDOCK_WINDOWS_CERT_SHA256 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Remove temporary Windows signing files
        if: always() && runner.os == 'Windows' && steps.windows_signing.outputs.directory != ''
        shell: powershell
        env:
          SIGNING_DIRECTORY: ${{ steps.windows_signing.outputs.directory }}
        run: ./scripts/windows/Remove-CiSigning.ps1 -Directory $env:SIGNING_DIRECTORY
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo chown root:root release/linux*/chrome-sandbox
          sudo chmod 4755 release/linux*/chrome-sandbox
          xvfb-run --auto-servernum pnpm test:packaged
      - if: runner.os != 'Linux'
        run: pnpm test:packaged
      - if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then
            for bundle in release/mac*/MineDock.app; do
              codesign --verify --deep --strict "$bundle"
              xcrun stapler validate "$bundle"
              spctl --assess --type execute "$bundle"
            done
          fi
      - run: pnpm updates:sign
        env:
          MINEDOCK_UPDATE_PRIVATE_KEY: ${{ secrets.MINEDOCK_UPDATE_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: minedock-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/update-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.official_checks || inputs.paper_eula_gate)
        with:
          name: official-checks-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            data/official-validation/**/result.json
            data/live-smoke/result.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}-${{ matrix.arch }}
          path: test-results/
      # Verified update metadata is published only with the repository owner's release key.
